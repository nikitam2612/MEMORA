<!-- =====================================================================
 MEMORA BACKEND CONFIG  (Phase 2A — Firebase init + Email/Password auth)
 =====================================================================
 Shared Firebase project: memoraweb-94009
 This file uses Firebase Authentication (Email + Password) and Cloud
 Firestore as the real, shared, cross-device backend. Paste the real
 Web App config from Firebase Console → Project settings → Your apps
 into the object below. Until apiKey/projectId are filled in, the app
 falls back to LOCAL-ONLY mode (localStorage) exactly as before.

 EmailJS below is UNRELATED to sign-in — it is only used, optionally,
 for sending transactional emails (order receipts/status updates) to
 customers. It is a client-side, best-effort prototype notification
 channel, not a secure backend and not part of authentication.
====================================================================== -->
